name: Deploy web to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 8disc-production
  cancel-in-progress: true

env:
  APP_PORT: '2000'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.22.0'
  SERVICE_NAME: 8disc

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/8disc' }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          : "${PUBLIC_SITE_URL:?Set the PUBLIC_SITE_URL secret}"
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project
        run: pnpm check

      - name: Build Docker image
        id: docker_image
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: |
          set -Eeuo pipefail
          : "${PUBLIC_SITE_URL:?Set the PUBLIC_SITE_URL secret}"
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}"
          docker build \
            --build-arg PUBLIC_SITE_URL="$PUBLIC_SITE_URL" \
            --build-arg PNPM_VERSION="$PNPM_VERSION" \
            --label "com.8disc.service=${SERVICE_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${SERVICE_NAME}:${image_tag}" \
            .
          docker save -o /tmp/8disc-image.tar "${SERVICE_NAME}:${image_tag}"
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          : "${VPS_USER:?Set the VPS_USER secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/8disc_deploy_key
          chmod 600 ~/.ssh/8disc_deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment assets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/8disc_deploy_key -P "$SSH_PORT" \
            /tmp/8disc-image.tar docker-compose.yml \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Deploy and restart container
        env:
          APP_IMAGE_TAG: ${{ steps.docker_image.outputs.tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/8disc_deploy_key -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' APP_IMAGE='$SERVICE_NAME:${APP_IMAGE_TAG}' APP_PORT='$APP_PORT' SERVICE_NAME='$SERVICE_NAME' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is required on the VPS. Install Docker Engine before deploying." >&2
            exit 1
          fi

          if ! sudo docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is required on the VPS." >&2
            exit 1
          fi

          sudo mkdir -p "$APP_DIR"
          sudo cp /tmp/8disc-image.tar "$APP_DIR/8disc-image.tar"
          sudo cp /tmp/docker-compose.yml "$APP_DIR/docker-compose.yml"
          printf 'APP_IMAGE=%s\nAPP_PORT=%s\nCONTAINER_NAME=%s\n' "$APP_IMAGE" "$APP_PORT" "$SERVICE_NAME" | \
            sudo tee "$APP_DIR/.env" >/dev/null
          sudo docker image load -i "$APP_DIR/8disc-image.tar"
          sudo docker compose -f "$APP_DIR/docker-compose.yml" --env-file "$APP_DIR/.env" up -d --remove-orphans

          for attempt in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/robots.txt"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Health check failed after 20 attempts" >&2
              sudo docker compose -f "$APP_DIR/docker-compose.yml" --env-file "$APP_DIR/.env" ps
              exit 1
            fi
            sleep 3
          done

          current_image_id="$(sudo docker image inspect -f '{{.Id}}' "$APP_IMAGE")"
          sudo docker images --filter "label=com.8disc.service=$SERVICE_NAME" --format '{{.Repository}}:{{.Tag}} {{.ID}}' | \
            while read -r image_name image_id; do
              if [ "$image_name" != "$APP_IMAGE" ] && [ "$image_id" != "$current_image_id" ]; then
                sudo docker image rm "$image_name" >/dev/null 2>&1 || true
              fi
            done
          REMOTE
